<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 动态模型管理终端</title>
    <style>
        :root { --primary: #007aff; --success: #34c759; --bg: #f2f2f7; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 500px; padding: 24px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
        .h-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: #1c1c1e; text-align: center; }
        .item { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #8e8e93; margin-bottom: 6px; margin-left: 4px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 10px; box-sizing: border-box; font-size: 1rem; transition: border 0.2s; }
        input:focus { border-color: var(--primary); outline: none; }
        
        .row { display: flex; gap: 10px; }
        button { border: none; border-radius: 10px; padding: 12px 18px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-pull { background: var(--success); color: white; white-space: nowrap; }
        .btn-test { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-save { background: #3a3a3c; color: white; width: 100%; margin-top: 8px; }
        
        #log { margin-top: 20px; padding: 12px; background: #1c1c1e; color: #00ff41; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.8rem; min-height: 40px; overflow-wrap: break-word; }
        .preset-area { margin-top: 25px; border-top: 1px solid #e5e5ea; pt: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="h-title">API 接口调试</div>

    <div class="item">
        <label>API 基础地址 (Base URL)</label>
        <input type="text" id="baseUrl" placeholder="例如: https://api.openai.com/v1">
    </div>

    <div class="item">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div class="item">
        <label>当前可用模型</label>
        <div class="row">
            <select id="modelList">
                <option value="">请先执行拉取...</option>
            </select>
            <button class="btn-pull" onclick="fetchRemoteModels()">拉取模型</button>
        </div>
    </div>

    <button class="btn-test" onclick="runTest()">进行接口测试 (Hello World)</button>
    <button class="btn-save" onclick="saveToLocal()">保存此套预设</button>

    <div id="log">等待指令...</div>

    <div class="preset-area">
        <label>载入历史预设</label>
        <select id="presets" onchange="loadConfig(this.value)">
            <option value="">-- 选择已存配置 --</option>
        </select>
    </div>
</div>

<script>
    const logBox = document.getElementById('log');
    
    function print(msg, color) {
        logBox.innerText = msg;
        if(color) logBox.style.color = color;
    }

    // 核心功能：从输入的 API 地址拉取模型列表
    async function fetchRemoteModels() {
        let url = document.getElementById('baseUrl').value.trim();
        const key = document.getElementById('apiKey').value.trim();

        if(!url) return print("错误: 请输入 API 地址", "#ff453a");
        
        // 自动修正 URL：确保以 /models 结尾
        const fetchUrl = url.endsWith('/') ? `${url}models` : `${url}/models`;
        
        print("正在连接 API 获取模型列表...");
        
        try {
            const response = await fetch(fetchUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${key}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error(`状态码: ${response.status}`);

            const data = await response.json();
            const select = document.getElementById('modelList');
            select.innerHTML = ''; // 清空旧的

            // 解析 OpenAI 标准格式的 models 数据
            if (data.data && Array.isArray(data.data)) {
                data.data.forEach(m => {
                    let opt = document.createElement('option');
                    opt.value = m.id;
                    opt.innerText = m.id;
                    select.appendChild(opt);
                });
                print(`成功拉取 ${data.data.length} 个模型`, "#32ade6");
            } else {
                throw new Error("API 返回格式不规范");
            }
        } catch (err) {
            print("拉取失败: " + err.message, "#ff453a");
        }
    }

    // 功能：简单的 Chat 测试
    async function runTest() {
        const url = document.getElementById('baseUrl').value.trim();
        const key = document.getElementById('apiKey').value.trim();
        const model = document.getElementById('modelList').value;

        if(!model) return print("请先选择一个模型", "#ff453a");

        const chatUrl = url.endsWith('/') ? `${url}chat/completions` : `${url}/chat/completions`;
        print("正在发送测试请求...");

        try {
            const res = await fetch(chatUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${key}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    messages: [{role: "user", content: "hi"}],
                    max_tokens: 10
                })
            });
            const result = await res.json();
            if(result.choices) {
                print("测试成功: " + result.choices[0].message.content);
            } else {
                print("测试失败: " + JSON.stringify(result), "#ff453a");
            }
        } catch (e) {
            print("连接异常: " + e.message, "#ff453a");
        }
    }

    // 预设保存逻辑
    function saveToLocal() {
        const name = prompt("给这套配置起个名字:");
        if(!name) return;
        const config = {
            u: document.getElementById('baseUrl').value,
            k: document.getElementById('apiKey').value
        };
        let store = JSON.parse(localStorage.getItem('api_configs') || '{}');
        store[name] = config;
        localStorage.setItem('api_configs', JSON.stringify(store));
        initPresets();
        print("配置 '" + name + "' 已存至本地");
    }

    function initPresets() {
        const store = JSON.parse(localStorage.getItem('api_configs') || '{}');
        const select = document.getElementById('presets');
        select.innerHTML = '<option value="">-- 选择已存配置 --</option>';
        for(let k in store) {
            let opt = document.createElement('option');
            opt.value = k;
            opt.innerText = k;
            select.appendChild(opt);
        }
    }

    function loadConfig(name) {
        if(!name) return;
        const store = JSON.parse(localStorage.getItem('api_configs') || '{}');
        document.getElementById('baseUrl').value = store[name].u;
        document.getElementById('apiKey').value = store[name].k;
        print("已载入: " + name);
    }

    initPresets();
</script>

</body>
</html>
